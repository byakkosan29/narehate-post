<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Narehate Postal Service</title>
  <meta name="description" content="Correspondence from somewhere that never existed.">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #17130f;
      color: #eee7dc;
      font-family: Georgia, "Times New Roman", serif;
    }
    body { display: grid; place-items: center; }
    main { text-align: center; padding: 40px; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 24px;
      display: grid; place-items: center;
      border: 1px solid rgba(238,231,220,.35);
      font-size: 28px;
    }
    h1 { margin: 0; letter-spacing: .28em; font-size: 18px; font-weight: 500; }
    p {
      margin-top: 12px; color: rgba(238,231,220,.55);
      font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">N</div>
    <h1>NAREHATE</h1>
    <p>Postal Service · Establishing Correspondence</p>
  </main>
</body>
</html>
