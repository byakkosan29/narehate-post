<script>

/* =========================================================
   NAREHATE REGISTRATION PAGE
   ---------------------------------------------------------
   Current visual registration fields:

   - name
   - username
   - password
   - email
   - dob
   - gender
   - hobbies
   - occupation

   DEVELOPMENT:
   Form validation + DOB display + back navigation.

   Backend registration belum dipasang pada block ini.
   ========================================================= */


/* =========================================================
   DOM ELEMENTS
   ========================================================= */

const registrationForm =
  document.getElementById(
    'registration-form'
  );


const registrationStatus =
  document.getElementById(
    'registration-status'
  );


const registrationName =
  document.getElementById(
    'registration-name'
  );


const registrationUsername =
  document.getElementById(
    'registration-username'
  );


const registrationPassword =
  document.getElementById(
    'registration-password'
  );


const registrationEmail =
  document.getElementById(
    'registration-email'
  );


const registrationDob =
  document.getElementById(
    'registration-dob'
  );


const registrationGender =
  document.getElementById(
    'registration-gender'
  );


const registrationHobbies =
  document.getElementById(
    'registration-hobbies'
  );


const registrationOccupation =
  document.getElementById(
    'registration-occupation'
  );


const registrationSubmit =
  document.getElementById(
    'registration-submit'
  );


const registrationBack =
  document.getElementById(
    'registration-back'
  );


/* <Start> BLOCK 44A — ELEMENT VALIDATION */

/* =========================================================
   ELEMENT VALIDATION
   ---------------------------------------------------------
   registration-status bersifat OPTIONAL.

   Artwork registration saat ini tidak memiliki visible
   status field, jadi halaman tetap valid tanpa elemen itu.
   ========================================================= */

const registrationRequiredElements = [

  {
    name:
      'registration-form',

    element:
      registrationForm

  },

  {
    name:
      'registration-name',

    element:
      registrationName

  },

  {
    name:
      'registration-username',

    element:
      registrationUsername

  },

  {
    name:
      'registration-password',

    element:
      registrationPassword

  },

  {
    name:
      'registration-email',

    element:
      registrationEmail

  },

  {
    name:
      'registration-dob',

    element:
      registrationDob

  },

  {
    name:
      'registration-gender',

    element:
      registrationGender

  },

  {
    name:
      'registration-hobbies',

    element:
      registrationHobbies

  },

  {
    name:
      'registration-occupation',

    element:
      registrationOccupation

  },

  {
    name:
      'registration-submit',

    element:
      registrationSubmit

  },

  {
    name:
      'registration-back',

    element:
      registrationBack

  }

];


const registrationMissingElements =
  registrationRequiredElements
    .filter(
      function(item) {

        return !item.element;

      }
    );


if (
  registrationMissingElements.length > 0
) {

  console.error(
    '[NAREHATE] Missing registration elements:',
    registrationMissingElements.map(
      function(item) {

        return item.name;

      }
    )
  );

}


/* <Finish> BLOCK 44A — ELEMENT VALIDATION */

/* =========================================================
   PREFILL IDENTIFIER
   ---------------------------------------------------------
   Jika user datang dari Correspondence Gate:

       /registration.html?identifier=stefanus

   identifier akan masuk ke USERNAME.

   Password TIDAK pernah dimasukkan melalui URL.
   ========================================================= */

const registrationParams =
  new URLSearchParams(
    window.location.search
  );


const registrationIdentifier =
  registrationParams.get(
    'identifier'
  );


if (
  registrationIdentifier &&
  registrationUsername
) {

  registrationUsername.value =
    registrationIdentifier
      .trim()
      .toLowerCase();

}


/* =========================================================
   REGISTRATION STATUS
   ========================================================= */

function showRegistrationStatus(
  message,
  isError
) {

  if (
    !registrationStatus
  ) {

    return;

  }


  registrationStatus.textContent =
    message;


  registrationStatus.classList.toggle(
    'is-error',
    !!isError
  );


  registrationStatus.classList.toggle(
    'is-success',
    !isError
  );

}


/* =========================================================
   DOB DISPLAY SYSTEM
   ========================================================= */

const dobField =
  document.getElementById(
    'registration-dob-field'
  );


const dobPlaceholder =
  document.getElementById(
    'registration-dob-placeholder'
  );


const dobValue =
  document.getElementById(
    'registration-dob-value'
  );


/* =========================================================
   FORMAT DATE
   ---------------------------------------------------------
   Browser value:
       YYYY-MM-DD

   Display:
       DD Month YYYY
   ========================================================= */

function formatDob(
  value
) {

  if (
    !value
  ) {

    return '';

  }


  const parts =
    value.split('-');


  if (
    parts.length !== 3
  ) {

    return '';

  }


  const year =
    parts[0];


  const month =
    Number(
      parts[1]
    );


  const day =
    Number(
      parts[2]
    );


  const months = [

    'January',

    'February',

    'March',

    'April',

    'May',

    'June',

    'July',

    'August',

    'September',

    'October',

    'November',

    'December'

  ];


  if (
    !months[month - 1]
  ) {

    return '';

  }


  return (
    day +
    ' ' +
    months[month - 1] +
    ' ' +
    year
  );

}


/* =========================================================
   UPDATE DOB DISPLAY
   ========================================================= */

function updateDobState() {

  if (
    !registrationDob ||
    !dobField ||
    !dobValue
  ) {

    return;

  }


  const value =
    registrationDob.value;


  if (
    value
  ) {

    const formatted =
      formatDob(
        value
      );


    dobValue.textContent =
      formatted;


    dobField.classList.remove(
      'is-empty'
    );


    dobField.classList.add(
      'has-value'
    );

  } else {

    dobValue.textContent =
      '';


    dobField.classList.remove(
      'has-value'
    );


    dobField.classList.add(
      'is-empty'
    );

  }

}


/* =========================================================
   OPEN CALENDAR
   ---------------------------------------------------------
   Seluruh DOB textbox menjadi calendar trigger.
   ========================================================= */

if (
  dobField &&
  registrationDob
) {

  dobField.addEventListener(
    'click',
    function() {

      if (
        typeof registrationDob.showPicker ===
        'function'
      ) {

        try {

          registrationDob.showPicker();

        } catch (
          error
        ) {

          registrationDob.focus();

        }

      } else {

        registrationDob.focus();

      }

    }
  );


  registrationDob.addEventListener(
    'change',
    function() {

      updateDobState();

    }
  );


  updateDobState();

}


/* <Start> BLOCK 48 — NATIVE REGISTRATION SUBMIT */

/* =========================================================
   FORM SUBMIT
   ---------------------------------------------------------
   Flow:

   Registration Form
        ↓
   HTML Validation
        ↓
   Normalize Username
        ↓
   Validate Password
        ↓
   Build Registration Payload
        ↓
   API credentialregister
        ↓
   Account Created
   ========================================================= */

if (
  registrationForm
) {

  registrationForm.addEventListener(
    'submit',
    async function(event) {

      event.preventDefault();


      /* -----------------------------------------------
         HTML VALIDATION
         ----------------------------------------------- */

      if (
        !registrationForm.checkValidity()
      ) {

        registrationForm.reportValidity();

        showRegistrationStatus(
          'Please complete the required fields.',
          true
        );

        return;

      }


      /* -----------------------------------------------
         USERNAME NORMALIZATION
         ----------------------------------------------- */

      const usernameValue =
        registrationUsername.value
          .trim()
          .toLowerCase();


      registrationUsername.value =
        usernameValue;


      /* -----------------------------------------------
         USERNAME VALIDATION
         ----------------------------------------------- */

      const usernamePattern =
        /^[a-z0-9_.]{3,24}$/;


      if (
        !usernamePattern.test(
          usernameValue
        )
      ) {

        showRegistrationStatus(
          'Username must be 3–24 characters using lowercase letters, numbers, dots or underscores.',
          true
        );

        registrationUsername.focus();

        return;

      }


      /* -----------------------------------------------
         PASSWORD VALIDATION
         ----------------------------------------------- */

      if (
        registrationPassword.value.length <
        8
      ) {

        showRegistrationStatus(
          'Password must contain at least 8 characters.',
          true
        );

        registrationPassword.focus();

        return;

      }


      /* -----------------------------------------------
         DOB VALIDATION
         ----------------------------------------------- */

      if (
        !registrationDob.value
      ) {

        showRegistrationStatus(
          'Please tell us when your story began.',
          true
        );

        registrationDob.focus();

        return;

      }


      /* -----------------------------------------------
         DISABLE SUBMIT
         ----------------------------------------------- */

      registrationSubmit.disabled =
        true;


      registrationSubmit.style.pointerEvents =
        'none';


      showRegistrationStatus(
        'Registering your correspondence...',
        false
      );


      /* -----------------------------------------------
         BUILD PAYLOAD
         ----------------------------------------------- */

      const registrationData = {

        name:
          registrationName.value
            .trim(),

        username:
          usernameValue,

        password:
          registrationPassword.value,

        email:
          registrationEmail.value
            .trim()
            .toLowerCase(),

        dob:
          registrationDob.value,

        gender:
          registrationGender.value,

        hobbies:
          registrationHobbies.value
            .trim(),

        occupation:
          registrationOccupation.value
            .trim()

      };


      /* -----------------------------------------------
         SEND TO BACKEND
         ----------------------------------------------- */

      try {

        const response =
          await fetch(
            '/api',
            {
              method:
                'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body:
                JSON.stringify({

                  action:
                    'credentialregister',

                  data:
                    registrationData

                })

            }
          );


        /* ---------------------------------------------
           HTTP ERROR
           --------------------------------------------- */

        if (
          !response.ok
        ) {

          throw new Error(
            'Registration request failed.'
          );

        }


        const result =
          await response.json();


        console.log(
          '[NAREHATE] REGISTRATION RESPONSE:',
          result
        );


        /* ---------------------------------------------
           BACKEND ERROR
           --------------------------------------------- */

        if (
          !result ||
          result.success !== true
        ) {

          throw new Error(
            result &&
            result.error
              ? result.error
              : 'Registration failed.'
          );

        }


        /* ---------------------------------------------
           REGISTRATION SUCCESS
           --------------------------------------------- */

        showRegistrationStatus(
          'Your correspondence has been registered.',
          false
        );


        console.log(
          '[NAREHATE] NAREHATE ACCOUNT CREATED:',
          result.user
        );


        /* ---------------------------------------------
           NEXT STEP
           ---------------------------------------------
           Untuk sekarang kita belum redirect.

           Kita pastikan dulu API registration benar-benar
           berhasil dari browser.

           Redirect ke Central Office akan kita pasang
           setelah response ini tervalidasi.
           --------------------------------------------- */


      } catch (
        error
      ) {

        console.error(
          '[NAREHATE] REGISTRATION ERROR:',
          error
        );


        showRegistrationStatus(
          error.message ||
          'Registration failed. Please try again.',
          true
        );


      } finally {

        registrationSubmit.disabled =
          false;


        registrationSubmit.style.pointerEvents =
          'auto';

      }

    }
  );

}


/* <Finish> BLOCK 48 — NATIVE REGISTRATION SUBMIT */

      window.location.href =

  );
