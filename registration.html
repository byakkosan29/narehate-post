<script>

/* =========================================================
   NAREHATE REGISTRATION PAGE
   ---------------------------------------------------------
   Current visual registration fields:

   - name
   - username
   - password
   - email
   - dob
   - gender
   - hobbies
   - occupation

   DEVELOPMENT:
   Form validation + DOB display + back navigation.

   Backend registration belum dipasang pada block ini.
   ========================================================= */


/* =========================================================
   DOM ELEMENTS
   ========================================================= */

const registrationForm =
  document.getElementById(
    'registration-form'
  );


const registrationStatus =
  document.getElementById(
    'registration-status'
  );


const registrationName =
  document.getElementById(
    'registration-name'
  );


const registrationUsername =
  document.getElementById(
    'registration-username'
  );


const registrationPassword =
  document.getElementById(
    'registration-password'
  );


const registrationEmail =
  document.getElementById(
    'registration-email'
  );


const registrationDob =
  document.getElementById(
    'registration-dob'
  );


const registrationGender =
  document.getElementById(
    'registration-gender'
  );


const registrationHobbies =
  document.getElementById(
    'registration-hobbies'
  );


const registrationOccupation =
  document.getElementById(
    'registration-occupation'
  );


const registrationSubmit =
  document.getElementById(
    'registration-submit'
  );


const registrationBack =
  document.getElementById(
    'registration-back'
  );


/* <Start> BLOCK 44A — ELEMENT VALIDATION */

/* =========================================================
   ELEMENT VALIDATION
   ---------------------------------------------------------
   registration-status bersifat OPTIONAL.

   Artwork registration saat ini tidak memiliki visible
   status field, jadi halaman tetap valid tanpa elemen itu.
   ========================================================= */

const registrationRequiredElements = [

  {
    name:
      'registration-form',

    element:
      registrationForm

  },

  {
    name:
      'registration-name',

    element:
      registrationName

  },

  {
    name:
      'registration-username',

    element:
      registrationUsername

  },

  {
    name:
      'registration-password',

    element:
      registrationPassword

  },

  {
    name:
      'registration-email',

    element:
      registrationEmail

  },

  {
    name:
      'registration-dob',

    element:
      registrationDob

  },

  {
    name:
      'registration-gender',

    element:
      registrationGender

  },

  {
    name:
      'registration-hobbies',

    element:
      registrationHobbies

  },

  {
    name:
      'registration-occupation',

    element:
      registrationOccupation

  },

  {
    name:
      'registration-submit',

    element:
      registrationSubmit

  },

  {
    name:
      'registration-back',

    element:
      registrationBack

  }

];


const registrationMissingElements =
  registrationRequiredElements
    .filter(
      function(item) {

        return !item.element;

      }
    );


if (
  registrationMissingElements.length > 0
) {

  console.error(
    '[NAREHATE] Missing registration elements:',
    registrationMissingElements.map(
      function(item) {

        return item.name;

      }
    )
  );

}


/* <Finish> BLOCK 44A — ELEMENT VALIDATION */

/* =========================================================
   PREFILL IDENTIFIER
   ---------------------------------------------------------
   Jika user datang dari Correspondence Gate:

       /registration.html?identifier=stefanus

   identifier akan masuk ke USERNAME.

   Password TIDAK pernah dimasukkan melalui URL.
   ========================================================= */

const registrationParams =
  new URLSearchParams(
    window.location.search
  );


const registrationIdentifier =
  registrationParams.get(
    'identifier'
  );


if (
  registrationIdentifier &&
  registrationUsername
) {

  registrationUsername.value =
    registrationIdentifier
      .trim()
      .toLowerCase();

}


/* =========================================================
   REGISTRATION STATUS
   ========================================================= */

function showRegistrationStatus(
  message,
  isError
) {

  if (
    !registrationStatus
  ) {

    return;

  }


  registrationStatus.textContent =
    message;


  registrationStatus.classList.toggle(
    'is-error',
    !!isError
  );


  registrationStatus.classList.toggle(
    'is-success',
    !isError
  );

}


/* =========================================================
   DOB DISPLAY SYSTEM
   ========================================================= */

const dobField =
  document.getElementById(
    'registration-dob-field'
  );


const dobPlaceholder =
  document.getElementById(
    'registration-dob-placeholder'
  );


const dobValue =
  document.getElementById(
    'registration-dob-value'
  );


/* =========================================================
   FORMAT DATE
   ---------------------------------------------------------
   Browser value:
       YYYY-MM-DD

   Display:
       DD Month YYYY
   ========================================================= */

function formatDob(
  value
) {

  if (
    !value
  ) {

    return '';

  }


  const parts =
    value.split('-');


  if (
    parts.length !== 3
  ) {

    return '';

  }


  const year =
    parts[0];


  const month =
    Number(
      parts[1]
    );


  const day =
    Number(
      parts[2]
    );


  const months = [

    'January',

    'February',

    'March',

    'April',

    'May',

    'June',

    'July',

    'August',

    'September',

    'October',

    'November',

    'December'

  ];


  if (
    !months[month - 1]
  ) {

    return '';

  }


  return (
    day +
    ' ' +
    months[month - 1] +
    ' ' +
    year
  );

}


/* =========================================================
   UPDATE DOB DISPLAY
   ========================================================= */

function updateDobState() {

  if (
    !registrationDob ||
    !dobField ||
    !dobValue
  ) {

    return;

  }


  const value =
    registrationDob.value;


  if (
    value
  ) {

    const formatted =
      formatDob(
        value
      );


    dobValue.textContent =
      formatted;


    dobField.classList.remove(
      'is-empty'
    );


    dobField.classList.add(
      'has-value'
    );

  } else {

    dobValue.textContent =
      '';


    dobField.classList.remove(
      'has-value'
    );


    dobField.classList.add(
      'is-empty'
    );

  }

}


/* =========================================================
   OPEN CALENDAR
   ---------------------------------------------------------
   Seluruh DOB textbox menjadi calendar trigger.
   ========================================================= */

if (
  dobField &&
  registrationDob
) {

  dobField.addEventListener(
    'click',
    function() {

      if (
        typeof registrationDob.showPicker ===
        'function'
      ) {

        try {

          registrationDob.showPicker();

        } catch (
          error
        ) {

          registrationDob.focus();

        }

      } else {

        registrationDob.focus();

      }

    }
  );


  registrationDob.addEventListener(
    'change',
    function() {

      updateDobState();

    }
  );


  updateDobState();

}


/* =========================================================
   <Start> BLOCK 49 — NATIVE REGISTRATION SUBMIT + TRANSITION
   ---------------------------------------------------------
   Registration flow:

   ACCEPT
      ↓
   DARK TRANSITION
      ↓
   LOADING ANIMATION
      ↓
   BACKEND REGISTRATION
      ↓
   SUCCESS ANIMATION
      ↓
   CENTRAL OFFICE HANDOFF

   Password tidak pernah disimpan ke handoff.
   ========================================================= */


/* =========================================================
   REGISTRATION TRANSITION OVERLAY
   ========================================================= */

function createRegistrationTransition() {

  /* -----------------------------------------
     Jangan membuat overlay dua kali.
     ----------------------------------------- */

  let overlay =
    document.getElementById(
      'narehate-registration-transition'
    );

  if (overlay) {

    return overlay;

  }


  /* -----------------------------------------
     Inject visual system.
     ----------------------------------------- */

  const style =
    document.createElement('style');

  style.id =
    'narehate-registration-transition-style';

  style.textContent = `

    #narehate-registration-transition {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(0, 0, 0, 0.82);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 700ms ease;

    }


    #narehate-registration-transition.is-visible {

      opacity: 1;

      pointer-events: all;

    }


    .narehate-transition-content {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 22px;

      text-align: center;

      color: #f4ead8;

      font-family:
        Georgia,
        'Times New Roman',
        serif;

    }


    .narehate-transition-animation {

      position: relative;

      width: 72px;

      height: 72px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    /* -----------------------------------------
       LOADING RING
       ----------------------------------------- */

    .narehate-loading-ring {

      width: 54px;

      height: 54px;

      border:

        2px solid

        rgba(244, 234, 216, 0.18);

      border-top-color:

        rgba(244, 234, 216, 0.95);

      border-right-color:

        rgba(244, 234, 216, 0.55);

      border-radius: 50%;

      animation:

        narehateSpin 1.1s

        linear infinite;

      transition:

        opacity 400ms ease,

        transform 400ms ease;

    }


    @keyframes narehateSpin {

      from {

        transform:
          rotate(0deg);

      }

      to {

        transform:
          rotate(360deg);

      }

    }


    /* -----------------------------------------
       SUCCESS CHECKMARK
       ----------------------------------------- */

    .narehate-success-mark {

      position: absolute;

      width: 58px;

      height: 58px;

      border:

        1px solid

        rgba(244, 234, 216, 0.8);

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      opacity: 0;

      transform:
        scale(0.55);

      transition:

        opacity 500ms ease,

        transform 500ms
        cubic-bezier(
          0.22,
          1,
          0.36,
          1
        );

    }


    .narehate-success-mark::after {

      content: '';

      width: 22px;

      height: 11px;

      border-left:

        2px solid

        #f4ead8;

      border-bottom:

        2px solid

        #f4ead8;

      transform:

        rotate(-45deg)

        translate(
          2px,
          -2px
        );

    }


    #narehate-registration-transition.is-success
    .narehate-loading-ring {

      opacity: 0;

      transform:
        scale(0.45);

      animation:
        none;

    }


    #narehate-registration-transition.is-success
    .narehate-success-mark {

      opacity: 1;

      transform:
        scale(1);

    }


    /* -----------------------------------------
       TEXT
       ----------------------------------------- */

    .narehate-transition-title {

      font-size: 15px;

      letter-spacing:
        0.22em;

      text-transform:
        uppercase;

      opacity: 0.95;

    }


    .narehate-transition-message {

      max-width: 360px;

      font-size: 12px;

      letter-spacing:
        0.08em;

      line-height: 1.7;

      opacity: 0.55;

    }


    /* -----------------------------------------
       ERROR STATE
       ----------------------------------------- */

    #narehate-registration-transition.is-error
    .narehate-loading-ring {

      animation: none;

      border-color:
        rgba(
          220,
          120,
          120,
          0.9
        );

    }

  `;

  document.head.appendChild(style);


  /* -----------------------------------------
     Create overlay.
     ----------------------------------------- */

  overlay =
    document.createElement('div');

  overlay.id =
    'narehate-registration-transition';


  overlay.innerHTML = `

    <div
      class="narehate-transition-content"
    >

      <div
        class="narehate-transition-animation"
      >

        <div
          class="narehate-loading-ring"
        ></div>

        <div
          class="narehate-success-mark"
        ></div>

      </div>


      <div
        class="narehate-transition-title"
        id="narehate-transition-title"
      >
        Registering correspondence
      </div>


      <div
        class="narehate-transition-message"
        id="narehate-transition-message"
      >
        Please wait while the registry records your correspondence.
      </div>

    </div>

  `;


  document.body.appendChild(
    overlay
  );


  return overlay;

}


/* =========================================================
   SHOW REGISTRATION TRANSITION
   ========================================================= */

function showRegistrationTransition(
  mode,
  title,
  message
) {

  const overlay =
    createRegistrationTransition();


  const titleElement =
    document.getElementById(
      'narehate-transition-title'
    );


  const messageElement =
    document.getElementById(
      'narehate-transition-message'
    );


  if (titleElement) {

    titleElement.textContent =
      title;

  }


  if (messageElement) {

    messageElement.textContent =
      message;

  }


  overlay.classList.remove(
    'is-success',
    'is-error'
  );


  if (mode === 'success') {

    overlay.classList.add(
      'is-success'
    );

  }


  if (mode === 'error') {

    overlay.classList.add(
      'is-error'
    );

  }


  requestAnimationFrame(
    function() {

      overlay.classList.add(
        'is-visible'
      );

    }
  );


  return overlay;

}


/* =========================================================
   <Start> REGISTRATION SUBMIT
   ========================================================= */

if (
  registrationForm
) {

  registrationForm.addEventListener(
    'submit',
    async function(event) {

      event.preventDefault();


      /* -----------------------------------------
         FRONTEND VALIDATION
         ----------------------------------------- */

      if (
        !registrationForm.checkValidity()
      ) {

        registrationForm.reportValidity();

        showRegistrationStatus(
          'Please complete the required fields.',
          true
        );

        return;

      }


      const usernameValue =
        registrationUsername.value
          .trim()
          .toLowerCase();


      registrationUsername.value =
        usernameValue;


      const usernamePattern =
        /^[a-z0-9_.]{3,24}$/;


      if (
        !usernamePattern.test(
          usernameValue
        )
      ) {

        showRegistrationStatus(
          'Username must be 3–24 characters using lowercase letters, numbers, dots or underscores.',
          true
        );

        registrationUsername.focus();

        return;

      }


      if (
        registrationPassword.value.length < 8
      ) {

        showRegistrationStatus(
          'Password must contain at least 8 characters.',
          true
        );

        registrationPassword.focus();

        return;

      }


      if (
        !registrationDob.value
      ) {

        showRegistrationStatus(
          'Please tell us when your story began.',
          true
        );

        registrationDob.focus();

        return;

      }


      /* -----------------------------------------
         LOCK FORM
         ----------------------------------------- */

      registrationSubmit.disabled =
        true;

      registrationSubmit.style.pointerEvents =
        'none';


      /* -----------------------------------------
         START VISUAL TRANSITION
         ----------------------------------------- */

      showRegistrationTransition(
        'loading',
        'Registering correspondence',
        'Please wait while the registry records your correspondence.'
      );


      /* -----------------------------------------
         PREPARE DATA
         ----------------------------------------- */

      const registrationData = {

        name:
          registrationName.value.trim(),

        username:
          usernameValue,

        password:
          registrationPassword.value,

        email:
          registrationEmail.value
            .trim()
            .toLowerCase(),

        dob:
          registrationDob.value,

        gender:
          registrationGender.value,

        hobbies:
          registrationHobbies.value.trim(),

        occupation:
          registrationOccupation.value.trim()

      };


      try {

        /* -----------------------------------------
           SEND TO BACKEND
           ----------------------------------------- */

        const response =
          await fetch(
            '/api',
            {
              method:
                'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body:
                JSON.stringify({
                  action:
                    'credentialregister',

                  data:
                    registrationData
                })
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            'Registration request failed.'
          );

        }


        const result =
          await response.json();


        console.log(
          '[NAREHATE] REGISTRATION RESPONSE:',
          result
        );


        /* -----------------------------------------
           BACKEND FAILURE
           ----------------------------------------- */

        if (
          !result ||
          result.success !== true
        ) {

          throw new Error(
            result &&
            result.error
              ? result.error
              : 'Registration failed.'
          );

        }


        /* -----------------------------------------
           SAVE SAFE REGISTRATION HANDOFF
           -----------------------------------------

           Password tidak pernah disimpan.

           Handoff hanya berisi sanitized user
           dari backend.
           ----------------------------------------- */

        if (
          result.user
        ) {

          sessionStorage.setItem(
            'NAREHATE_REGISTRATION_HANDOFF',
            JSON.stringify({
              authenticated:
                true,

              registered:
                true,

              user:
                result.user,

              timestamp:
                Date.now()
            })
          );

        }


        console.log(
          '[NAREHATE] NAREHATE ACCOUNT CREATED:',
          result.user
        );


        /* -----------------------------------------
           SUCCESS ANIMATION
           ----------------------------------------- */

        showRegistrationTransition(
          'success',
          'Correspondence established',
          'Your registry entry has been accepted. Opening Central Office...'
        );


        /* -----------------------------------------
           WAIT FOR SUCCESS ANIMATION
           ----------------------------------------- */

        await new Promise(
          function(resolve) {

            setTimeout(
              resolve,
              1300
            );

          }
        );


        /* -----------------------------------------
           MOVE TO MAIN APPLICATION
           ----------------------------------------- */

        window.location.href =
          '/';


      } catch (error) {

        console.error(
          '[NAREHATE] REGISTRATION ERROR:',
          error
        );


        /* -----------------------------------------
           ERROR STATE
           ----------------------------------------- */

        showRegistrationTransition(
          'error',
          'Registration could not be completed',
          error.message ||
            'Please check your correspondence and try again.'
        );


        showRegistrationStatus(
          error.message ||
            'Registration failed. Please try again.',
          true
        );


        /* -----------------------------------------
           RETURN CONTROL TO USER
           ----------------------------------------- */

        await new Promise(
          function(resolve) {

            setTimeout(
              resolve,
              1800
            );

          }
        );


        const overlay =
          document.getElementById(
            'narehate-registration-transition'
          );


        if (overlay) {

          overlay.classList.remove(
            'is-visible'
          );

        }


      } finally {

        registrationSubmit.disabled =
          false;

        registrationSubmit.style.pointerEvents =
          'auto';

      }

    }
  );

}
