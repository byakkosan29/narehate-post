<style>

/* =====================================================
   NAREHATE POSTAL SERVICE
   REGISTRATION PAGE
   ===================================================== */


/* =====================================================
   ROOT
   ===================================================== */

:root {

  --ink:
    #642319;

  --ink-soft:
    rgba(
      100,
      35,
      25,
      0.68
    );

  --paper-focus:
    rgba(
      255,
      238,
      204,
      0.18
    );

  --error:
    #7b2418;
}


/* =====================================================
   RESET
   ===================================================== */

* {

  box-sizing:
    border-box;
}


html,
body {

  width:
    100%;

  min-height:
    100%;

  margin:
    0;

  padding:

body {

  background:
    #17100b;

  color:

  font-family:
    Georgia,
    "Times New Roman",
    serif;

/* =====================================================
   REGISTRATION PAGE
   ===================================================== */

.registration-page {

  height:

/* =====================================================
   BACKGROUND ARTWORK
   -----------------------------------------------------
   Artwork ratio: 16 : 9

   Kita sengaja memakai tinggi viewport sebagai acuan.
   Dengan begitu artwork dan HTML overlay selalu
   menggunakan canvas yang sama.
   ===================================================== */

.registration-background {

  position:
    fixed;

  top:
    0;

  left:
    50%;

  transform:
    translateX(-50%);

  width:
    min(
      100vw,
      177.7777778vh
    );

  height:
    min(
      100vh,
      56.25vw
    );

  background-image:
    url(
      '/assets/environments/registration-bg.webp'
    );

  background-repeat:
    no-repeat;

  background-position:
    center
    center;

  background-size:
    100%
    100%;

  z-index:
    0;

  pointer-events:
    none;
}


/* =====================================================
   FORM LAYER
   -----------------------------------------------------
   IMPORTANT:
   Form canvas harus memiliki ukuran yang sama persis
   dengan artwork.
   ===================================================== */

.registration-layer {

  position:
    fixed;

  top:
    0;

  left:
    50%;

  transform:
    translateX(-50%);

  width:
    min(
      100vw,
      177.7777778vh
    );

  height:
    min(
      100vh,
      56.25vw
    );

  z-index:
    10;

  pointer-events:
    none;
}


/* =====================================================
   FORM
   ===================================================== */

.registration-form {

  position:
    absolute;

  inset:
    0;

  width:
    100%;

  height:
    100%;

  margin:
    0;

  padding:
    0;

  pointer-events:
    none;
}


/* =====================================================
   FIELD CONTAINER
   ===================================================== */

.registration-field {

  position:
    absolute;

  pointer-events:
    auto;
}


/* =====================================================
   ACCESSIBILITY LABEL
   -----------------------------------------------------
   Label tetap ada di HTML untuk accessibility,
   tetapi TIDAK BOLEH terlihat.

   Judul field sudah tercetak di artwork.
   ===================================================== */

.registration-field label {

  position:
    absolute;

  width:
    1px;

  height:
    1px;

  padding:
    0;

  margin:
    -1px;

  overflow:
    hidden;

  clip:
    rect(
      0,
      0,
      0,
      0
    );

  clip-path:
    inset(
      50%
    );

  white-space:
    nowrap;

  border:
    0;
}


/* =====================================================
   INPUT & SELECT
   ===================================================== */

.registration-field input,
.registration-field select {

  width:
    100%;

  height:
    100%;

  margin:
    0;

  padding:
    0
    10px;

  border:
    0;

  outline:
    none;

  border-radius:
    0;

  background:
    transparent;

  color:
    var(--ink);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(
      12px,
      1.05vw,
      17px
    );

  line-height:
    1;

  letter-spacing:
    0.15px;
}


/* =====================================================
   FOCUS
   ===================================================== */

.registration-field input:focus,
.registration-field select:focus {

  background:
    var(--paper-focus);

  box-shadow:
    inset
    0
    0
    0
    1px
    rgba(
      100,
      35,
      25,
      0.16
    );
}


/* =====================================================
   DATE INPUT
   ===================================================== */

.registration-field input[type="date"] {

  appearance:
    none;

  -webkit-appearance:
    none;

  color:
    var(--ink);
}


/*
   Chrome date picker icon dibuat transparan karena
   artwork sudah memiliki icon kalender sendiri.
*/

.registration-field input[type="date"]::-webkit-calendar-picker-indicator {

  opacity:
    0;

  cursor:
    pointer;
}


/* =====================================================
   SELECT
   ===================================================== */

.registration-field select {

  appearance:
    none;

  -webkit-appearance:
    none;

  cursor:
    pointer;
}


.registration-field select option {

  color:
    #3f1b16;

  background:
    #ead0a8;
}




/* <Start> BLOCK 39 — FIX DOB CUSTOM PLACEHOLDER */

<body>


  <main
    class="registration-page"
  >


    <!-- ================================================
         BACKGROUND
         ================================================ -->

    <!-- <Start> BLOCK 23 — REGISTRATION FORM -->

<form
  id="registration-form"
  class="registration-form"
  autocomplete="on"
>

  <!-- NAME -->

  <div
    id="registration-name-field"
    class="registration-field"
  >
    <label for="registration-name">
      Nama
    </label>

    <input
  type="text"
  id="registration-username"
  name="username"
  autocomplete="off"
  minlength="3"
  maxlength="24"
  pattern="[a-z0-9_.]{3,24}"
  placeholder="A name for the registry..."
  required
>
  </div>


 <!-- <Start> BLOCK 36 — NAREHATE REGISTRATION FIELDS -->

<!-- USERNAME -->

<div
  id="registration-username-field"
  class="registration-field"
>
  <label for="registration-username">
    Username
  </label>

  <input
    type="text"
    id="registration-username"
    name="username"
    autocomplete="off"
    minlength="3"
    maxlength="24"

  >

<!-- DATE OF BIRTH -->

<div

  class="registration-field"
>

  <label for="registration-dob">

  <span
    id="registration-dob-placeholder"
    class="dob-placeholder"
  >

  </span>

  <input
    type="date"
    id="registration-dob"
    name="dob"
  >

</div>


<!-- GENDER -->

<div
  id="registration-gender-field"
  class="registration-field"
>
  <label for="registration-gender">

  </label>

  <select
    id="registration-gender"
    name="gender"
  >

    <option
      value=""
      selected

      type="button"

      id="registration-back"
    >
      ← BACK
    </button>

  <script>

    /* ===================================================
       <Start> REGISTRATION PAGE TEST LOGIC
       ---------------------------------------------------
       DEVELOPMENT ONLY

       Belum terhubung ke backend.

       Tujuan tahap ini:
       - memastikan artwork
       - memastikan posisi field
       - memastikan query identifier
       - memastikan validation
       =================================================== */


    const form =
      document.getElementById(
        'registration-form'
      );


    const status =
      document.getElementById(
        'registration-status'
      );


    const username =
      document.getElementById(
        'registration-username'
      );


    const password =
      document.getElementById(
        'registration-password'
      );


    const confirmPassword =
      document.getElementById(
        'registration-confirm-password'
      );


    const submit =
      document.getElementById(
        'registration-submit'
      );


    const back =
      document.getElementById(
        'registration-back'
      );


    /* =================================================
       PREFILL IDENTIFIER
       -------------------------------------------------
       Jika datang dari:

       /registration.html?identifier=stefanus

       username akan otomatis terisi.

       Password TIDAK pernah diambil dari URL.
       ================================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const identifier =
      params.get(
        'identifier'
      );


    if (
      identifier
    ) {

      username.value =
        identifier
          .trim()
          .toLowerCase();

    }


    /* =================================================
       SUBMIT TEST
       ================================================= */

    form.addEventListener(
      'submit',
      function(event) {

        event.preventDefault();


        status.classList.remove(
          'is-error'
        );


        /* ---------------------------------------------
           Password
           --------------------------------------------- */

        if (
          password.value.length < 8
        ) {

          status.textContent =
            'Password minimal 8 karakter.';

          status.classList.add(
            'is-error'
          );

          password.focus();

          return;

        }


        


        /* ---------------------------------------------
           DEVELOPMENT STATUS
           --------------------------------------------- */

        status.textContent =
          'Registration form ready — backend connection belum dipasang.';


        console.log(
          '[NAREHATE] Registration form TEST OK.',
          {
            name:
              document
                .getElementById(
                  'registration-name'
                )
                .value,

            username:
              username.value,

            phone:
              document
                .getElementById(
                  'registration-phone'
                )
                .value,

            email:
              document
                .getElementById(
                  'registration-email'
                )
                .value,

            age:
              document
                .getElementById(
                  'registration-age'
                )
                .value,

            gender:
              document
                .getElementById(
                  'registration-gender'
                )
                .value,

            hobbies:
              document
                .getElementById(
                  'registration-hobbies'
                )
                .value,

            occupation:
              document
                .getElementById(
                  'registration-occupation'
                )
                .value
          }
        );

      }
    );


    /* =================================================
       BACK
       ================================================= */

    back.addEventListener(
      'click',
      function() {

        window.location.href =
          '/';

      }
    );


    /* ===================================================
       <Finish> REGISTRATION PAGE TEST LOGIC
       =================================================== */


/* <Start> BLOCK 40 — FIX DOB CALENDAR BEHAVIOR */

const dob =
  document.getElementById(
    'registration-dob'
  );


const dobField =
  document.getElementById(
    'registration-dob-field'
  );


/* -----------------------------------------------------
   UPDATE DOB VISUAL STATE
   ----------------------------------------------------- */

function updateDobState() {

  if (
    dob.value
  ) {

    dobField.classList.remove(
      'is-empty'
    );

    dobField.classList.add(
      'has-value'
    );

  } else {

    dobField.classList.remove(
      'has-value'
    );

    dobField.classList.add(
      'is-empty'
    );

  }
}


/* -----------------------------------------------------
   OPEN CALENDAR
   ----------------------------------------------------- */

dobField.addEventListener(
  'click',
  function() {

    if (
      typeof dob.showPicker ===
      'function'
    ) {

      try {

        dob.showPicker();

      } catch (
        error
      ) {

        dob.focus();

      }

    } else {

      dob.focus();

    }

  }
);


/* -----------------------------------------------------
   DATE CHANGED
   ----------------------------------------------------- */

dob.addEventListener(
  'change',
  function() {

    updateDobState();

  }
);


/* -----------------------------------------------------
   INITIAL STATE
   ----------------------------------------------------- */

updateDobState();


/* <Finish> BLOCK 40 */

  </script>
